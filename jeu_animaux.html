<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu Interactif - Mes Animaux</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --error: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 26px;
        }
        p.subtitle {
            color: #64748b;
            margin-bottom: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        .image-box {
            margin: 20px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            background: #f1f5f9;
            border: 3px solid #e2e8f0;
        }
        .image-box img {
            max-width: 100%;
            height: 260px;
            width: 320px;
            object-fit: cover;
            display: block;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .option-btn {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            background: #e2e8f0;
            border-color: var(--primary);
        }
        .option-btn.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }
        .option-btn.incorrect {
            background: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }
        #feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 24px;
        }
        .score-board {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            color: #64748b;
        }
        #restart-btn {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        #restart-btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Jeu Interactif : Vos Photos d'Animaux</h1>
        <p class="subtitle">Reconnaissez l'animal présenté sur chaque photo</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div id="quiz-content">
            <div class="image-box">
                <img id="animal-img" src="" alt="Animal">
            </div>
            <div class="options-grid" id="options"></div>
            <div id="feedback"></div>
            <div class="score-board" id="score-display">Score : 0 / 5</div>
        </div>
        <button id="restart-btn" onclick="restartGame()">Recommencer</button>
    </div>

                name: "Renard",
                options: ["Renard", "Loup", "Chat", "Écureuil"]
            },
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function loadQuestion() {
            answered = false;
            document.getElementById('feedback').textContent = '';
            const q = questions[currentQuestion];
            document.getElementById('animal-img').src = q.image;
            
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress').style.width = progressPercent + '%';

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            const shuffledOptions = shuffle([...q.options]);
            shuffledOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectOption(btn, option, q.name);
                optionsContainer.appendChild(btn);
            });
            document.getElementById('score-display').textContent = `Score : ${score} / ${questions.length}`;
        }

        function selectOption(button, selected, correct) {
            if (answered) return;
            answered = true;

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                if (btn.textContent === correct) {
                    btn.classList.add('correct');
                } else if (btn === button && selected !== correct) {
                    btn.classList.add('incorrect');
                }
                btn.disabled = true;
            });

            if (selected === correct) {
                score++;
                document.getElementById('feedback').style.color = 'var(--success)';
                document.getElementById('feedback').textContent = 'Correct ! 🎉';
            } else {
                document.getElementById('feedback').style.color = 'var(--error)';
                document.getElementById('feedback').textContent = `Incorrect. C'était : ${correct}`;
            }

            document.getElementById('score-display').textContent = `Score : ${score} / ${questions.length}`;

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 1500);
        }

        function endGame() {
            document.getElementById('progress').style.width = '100%';
            document.getElementById('quiz-content').innerHTML = `
                <h2>Partie terminée ! 🏆</h2>
                <p style="font-size: 18px; margin: 20px 0;">Votre score final est de <strong>${score} / ${questions.length}</strong></p>
            `;
            document.getElementById('restart-btn').style.display = 'inline-block';
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('quiz-content').innerHTML = `
                <div class="image-box">
                    <img id="animal-img" src="" alt="Animal">
                </div>
                <div class="options-grid" id="options"></div>
                <div id="feedback"></div>
                <div class="score-board" id="score-display">Score : 0 / 5</div>
            `;
            document.getElementById('restart-btn').style.display = 'none';
            loadQuestion();
        }

        loadQuestion();
    </script>
