<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu Interactif : Range les Animaux et les Plantes dans leur Milieu de Vie !</title>
    <style>
        html, body {
            height: 100vh;
            margin: 0;
            padding: 5px;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
            color: #333;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            color: #e65100;
            text-shadow: 1px 1px 3px #ffe082;
            font-size: 1.6rem;
            margin: 2px 0;
        }
        p.instructions {
            font-size: 0.95rem;
            color: #006064;
            margin: 2px 0 10px 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 950px;
            margin: 0 auto;
            height: calc(100vh - 75px);
            justify-content: space-between;
            padding-bottom: 5px;
        }
        .items-pool {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 8px 10px;
            min-height: 85px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            border: 3px dashed #ffb74d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }
        .pool-title {
            width: 100%;
            font-weight: bold;
            font-size: 1rem;
            color: #e65100;
            margin-bottom: 0px;
        }
        .categories-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            flex-grow: 1;
        }
        .category-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 3px solid #ccc;
            transition: all 0.3s ease;
        }
        .category-box.foret { border-color: #4caf50; background-color: #e8f5e9; }
        .category-box.desert { border-color: #ff9800; background-color: #fff3e0; }
        .category-box.eau { border-color: #2196f3; background-color: #e3f2fd; }
        
        .category-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            color: white;
            width: 80%;
        }
        .foret .category-title { background-color: #4caf50; }
        .desert .category-title { background-color: #ff9800; }
        .eau .category-title { background-color: #2196f3; }

        .drop-zone {
            flex-grow: 1;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            align-content: flex-start;
        }
        .draggable-card {
            width: 95px;
            background: white;
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.12);
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .draggable-card:active {
            cursor: grabbing;
        }
        .draggable-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .draggable-card .card-icon {
            font-size: 2rem;
            margin: 2px 0;
            pointer-events: none;
        }
        .draggable-card span {
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 2px;
            color: #333;
        }
        .bottom-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 5px;
        }
        .score-board {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2e7d32;
        }
        #btn-check {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 8px 22px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        #btn-check:hover {
            background-color: #f57c00;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.3rem;
            color: #388e3c;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 350px;
        }
        .modal-content button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <h1>🌿 Jeu des Milieux de Vie 🐾</h1>
            <p class="instructions">Glisse chaque animal et chaque plante dans son milieu naturel correct !</p>
        </div>

        <!-- Pool de départ -->
        <div class="items-pool" id="pool" ondragover="allowDrop(event)" ondrop="dropToPool(event)">
            <div class="pool-title">Éléments à ranger :</div>
            
            <div class="draggable-card" draggable="true" id="card-loup" ondragstart="drag(event)" data-category="foret">
                <div class="card-icon">🐺</div>
                <span>Loup</span>
            </div>
            <div class="draggable-card" draggable="true" id="card-fougere" ondragstart="drag(event)" data-category="foret">
                <div class="card-icon">🌿</div>
                <span>Fougère</span>
            </div>

            <div class="draggable-card" draggable="true" id="card-chameau" ondragstart="drag(event)" data-category="desert">
                <div class="card-icon">🐪</div>
                <span>Chameau</span>
            </div>
            <div class="draggable-card" draggable="true" id="card-cactus" ondragstart="drag(event)" data-category="desert">
                <div class="card-icon">🌵</div>
                <span>Cactus</span>
            </div>
            <div class="draggable-card" draggable="true" id="card-palmier" ondragstart="drag(event)" data-category="desert">
                <div class="card-icon">🌴</div>
                <span>Palmier</span>
            </div>

            <div class="draggable-card" draggable="true" id="card-crabe" ondragstart="drag(event)" data-category="eau">
                <div class="card-icon">🦀</div>
                <span>Crabe</span>
            </div>
            <div class="draggable-card" draggable="true" id="card-algues" ondragstart="drag(event)" data-category="eau">
                <div class="card-icon">🌊</div>
                <span>Algues</span>
            </div>
        </div>

        <!-- Catégories -->
        <div class="categories-container">
            <div class="category-box foret">
                <div class="category-title">🌲 Forêt</div>
                <div class="drop-zone" id="zone-foret" ondragover="allowDrop(event)" ondrop="drop(event, 'foret')"></div>
            </div>
            <div class="category-box desert">
                <div class="category-title">🌵 Désert</div>
                <div class="drop-zone" id="zone-desert" ondragover="allowDrop(event)" ondrop="drop(event, 'desert')"></div>
            </div>
            <div class="category-box eau">
                <div class="category-title">🌊 Eau</div>
                <div class="drop-zone" id="zone-eau" ondragover="allowDrop(event)" ondrop="drop(event, 'eau')"></div>
            </div>
        </div>

        <div class="bottom-panel">
            <button id="btn-check" onclick="checkAnswers()">Vérifier</button>
            <div class="score-board" id="score-board"></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modal-text">
            Bravo ! Tout est parfaitement rangé ! 🎉
            <br>
            <button onclick="closeModal()">Rejouer</button>
        </div>
    </div>

    <script>
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.closest('.draggable-card').id);
        }

        function drop(ev, category) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            var card = document.getElementById(data);
            let zone = ev.target.closest('.drop-zone');
            if (zone) {
                zone.appendChild(card);
            }
        }

        function dropToPool(ev) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            var card = document.getElementById(data);
            let pool = document.getElementById('pool');
            pool.appendChild(card);
        }

        function checkAnswers() {
            let cards = document.querySelectorAll('.draggable-card');
            let correctCount = 0;
            let total = cards.length;
            let pool = document.getElementById('pool');

            let inPool = pool.querySelectorAll('.draggable-card').length;
            if (inPool > 0) {
                document.getElementById('score-board').innerText = "Il reste des éléments à ranger !";
                document.getElementById('score-board').style.color = "#d32f2f";
                return;
            }

            cards.forEach(card => {
                let expected = card.getAttribute('data-category');
                let parentZone = card.closest('.drop-zone');
                if (parentZone && parentZone.id === 'zone-' + expected) {
                    correctCount++;
                }
            });

            let scoreBoard = document.getElementById('score-board');
            if (correctCount === total) {
                document.getElementById('modal').style.display = 'flex';
            } else {
                scoreBoard.innerText = `${correctCount}/${total} correct. Essaie encore ! 🔄`;
                scoreBoard.style.color = "#f57c00";
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            let pool = document.getElementById('pool');
            document.querySelectorAll('.draggable-card').forEach(card => {
                pool.appendChild(card);
            });
            document.getElementById('score-board').innerText = "";
        }
    </script>
</body>
</html>
